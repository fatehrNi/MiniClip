name: build

# Windows runner 自带 .NET Framework 4.x 的 csc.exe，本项目不需要装任何东西即可构建
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 编译（系统自带 csc.exe）
        shell: pwsh
        run: |
          ./build.ps1
          if (-not (Test-Path ./MiniClip.exe)) { throw "没产出 MiniClip.exe" }
          $fi = Get-Item ./MiniClip.exe
          "大小 {0:N1} KB" -f ($fi.Length / 1KB)
          $v = $fi.VersionInfo
          "文件属性：{0} {1} / {2}" -f $v.ProductName, $v.FileVersion, $v.FileDescription

      - name: 自检（不依赖真实剪贴板的项）
        shell: pwsh
        run: |
          # MiniClip.exe 是 GUI 子系统程序，PowerShell 的 & 调用不会等待，也不一定能拿到输出，
          # 所以统一用 Start-Process -Wait + 重定向，失败必须让 CI 红。
          function Mc([string]$args_) {
            $o = [System.IO.Path]::GetTempFileName()
            $p = Start-Process -FilePath ./MiniClip.exe -ArgumentList $args_ -PassThru -Wait -NoNewWindow `
                    -RedirectStandardOutput $o -RedirectStandardError "$o.err"
            $t = [System.IO.File]::ReadAllText($o)
            if ($p.ExitCode -ne 0) { throw "MiniClip $args_ 退出码 $($p.ExitCode)`n$t" }
            Write-Host "--- $args_ ---"; Write-Host $t
          }
          Mc "--version"
          Mc "--help"
          Mc "--bench-store 2000 200"
          Mc "--bench-load"
          if (Test-Path "$env:LOCALAPPDATA\..\..\MiniClip\crash.log") { throw "存在 crash.log" }

      - name: 打包发布物
        shell: pwsh
        run: |
          ./release.ps1
          Get-ChildItem release | Format-Table Name,Length

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: MiniClip-windows
          path: release/*.zip

  release:
    # 打 v* 标签就自动发 GitHub Release：构建 zip、算 SHA256、上传附件。
    # 用工作区自带的 GITHUB_TOKEN，不需要个人凭据，也不引入第三方 Action。
    # 幂等：Release 已存在就更新说明、替换同名附件，所以重跑/重新打标都不会失败。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 构建发布包
        shell: pwsh
        run: ./release.ps1

      - name: 创建或更新 Release 并上传附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = Get-ChildItem release\*.zip | Select-Object -First 1
          if (-not $zip) { throw "release.ps1 没产出 zip" }
          $sum = Join-Path $zip.DirectoryName ($zip.BaseName + ".sha256.txt")
          $sha = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          $ver = $env:TAG.TrimStart('v')
          $sizeKB = [math]::Round($zip.Length / 1KB, 1)
          $body = @"
          ## MiniClip $ver

          Windows 轻量剪贴板历史：单文件、零安装零依赖（只用系统自带的 csc.exe 构建）、不联网、数据放在程序同级 data 目录。

          下载解压后双击 install.cmd（建快捷方式 + 开机自启 + 立即运行），或直接双击 MiniClip.exe。
          唤出历史：Ctrl+Alt+V。

          | 文件 | 大小 | SHA256 |
          | --- | --- | --- |
          | $($zip.Name) | $sizeKB KB | $sha |

          本地校验：certutil -hashfile $($zip.Name) SHA256
          "@
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; 'User-Agent' = 'miniclip-ci' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $payload = @{ tag_name = $env:TAG; name = "MiniClip $ver"; body = $body; draft = $false; prerelease = $false } | ConvertTo-Json
          try {
              $rel = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$env:TAG" -Headers $h -ErrorAction Stop
              Write-Host "[i] Release $env:TAG 已存在（id $($rel.id)），更新说明"
              $rel = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($rel.id)" -Headers $h -Body $payload
          } catch {
              $code = 0
              if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
              if ($code -ne 404) { throw }
              # by-tag 查询看不到草稿：tag 被移动或删除过时，原 Release 会退回草稿态。
              # 这时扫一遍列表按 tag 名找，优先已发布的那条，找不到才新建，避免重复建 Release。
              $cands = @(Invoke-RestMethod -Method Get -Uri "$api/releases?per_page=100" -Headers $h) | Where-Object { $_.tag_name -eq $env:TAG }
              $rel = $cands | Where-Object { -not $_.draft } | Select-Object -First 1
              if (-not $rel) { $rel = $cands | Select-Object -First 1 }
              if ($rel) {
                  Write-Host "[i] Release $env:TAG 已存在（草稿，id $($rel.id)），更新并发布"
                  $rel = Invoke-RestMethod -Method Patch -Uri "$api/releases/$($rel.id)" -Headers $h -Body $payload
              } else {
                  Write-Host "[i] 新建 Release $env:TAG"
                  $rel = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $h -Body $payload
              }
          }
          # 同名附件在重跑时会 422，先按名字删旧的再传，保证重跑结果一致
          foreach ($f in @($zip.FullName, $sum)) {
              if (-not (Test-Path $f)) { throw "缺少附件 $f" }
              $n = Split-Path $f -Leaf
              foreach ($a in @($rel.assets)) {
                  if ($a.name -eq $n) { Invoke-RestMethod -Method Delete -Uri "$api/releases/assets/$($a.id)" -Headers $h | Out-Null }
              }
              $up = $rel.upload_url.Split('{')[0] + "?name=" + [uri]::EscapeDataString($n)
              Invoke-RestMethod -Method Post -Uri $up -Headers ($h + @{ 'Content-Type' = 'application/octet-stream' }) -InFile $f | Out-Null
              Write-Host "[OK] 已上传 $n"
          }
          Write-Host "released: $($rel.html_url)"
